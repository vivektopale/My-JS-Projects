<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <link rel="shortcut icon" href="./images/vivek.jpg" type="image/x-icon">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      flex-direction: column;
    }
    canvas {
      background: #222;
      box-shadow: 0 0 10px #0f0;
    }
    h1 {
      margin-bottom: 10px;
    }
            #home{
            position: absolute;
            right: 1%;
            top: 1%;
            padding: 9px 8px;
            background-color: rgb(255, 241, 241);
            border-radius: 10px;
            text-decoration: none;
            /* font-size: 1.2em; */

        }
        #home:hover{
          background: #efececfa;
        }
  </style>
</head>
<body>
  <a href="./index.html" id="home">🏠</a>
  <h1>Snake Game</h1>
  <canvas id="game" width="500" height="600"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const box = 20; // grid size
    let score = 0;

    let snake = [{ x: 9 * box, y: 10 * box }];

    let food = {
      x: Math.floor(Math.random() * 19 + 1) * box,
      y: Math.floor(Math.random() * 19 + 1) * box,
    };

    let direction = null;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
      else if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
      else if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
      else if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#0f0" : "#fff";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
      }

      // Draw food
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      // Move snake
      let headX = snake[0].x;
      let headY = snake[0].y;

      if (direction === "UP") headY -= box;
      if (direction === "DOWN") headY += box;
      if (direction === "LEFT") headX -= box;
      if (direction === "RIGHT") headX += box;

      // Game over: wall or self
      if (
        headX < 0 || headY < 0 ||
        headX >= canvas.width || headY >= canvas.height ||
        snake.some((seg, i) => i !== 0 && seg.x === headX && seg.y === headY)
      ) {
        clearInterval(game);
        alert("Game Over! Your score: " + score);
        return;
      }

      // Eat food
      if (headX === food.x && headY === food.y) {
        score++;
        food = {
          x: Math.floor(Math.random() * 19 + 1) * box,
          y: Math.floor(Math.random() * 19 + 1) * box,
        };
      } else {
        snake.pop();
      }

      // Add new head
      snake.unshift({ x: headX, y: headY });

      // Show score
      ctx.fillStyle = "#fff";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + score, 10, 390);
    }

    const game = setInterval(draw, 100);
  </script>
</body>
</html>
