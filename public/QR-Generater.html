<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRcode generator</title>
    <link rel="shortcut icon" href="./images/vivek.jpg" type="image/x-icon">

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(13, 30, 60);
        }
        .box{
            background-color:#155e75;
            padding: 30px;
            width: 400px;
            border-radius: 8px;
        }
        .qr-header h1{
            font-size: 26px;
            text-align: center;
            color: aliceblue;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .qr-header input{
            width: 100%;
            margin-block: 12px;
        }
        .qr-header input,select{
            padding: 8px;
            border-radius: 8px;
            font-size: 18px;
            outline: none;
            border: 1px solid #7fb7c9;
        }
        .qr-header label{
            color: aliceblue;
            font-size: 20px;

        }
        .qr-header div{
            display: flex;
            justify-content: space-between;
        }
        .qr-footer{
            display: flex;
            justify-content: center;
        }
        .qr-footer a{
            background-color: aliceblue;
            text-decoration: none;
            font-size: 20px;
            padding: 14px 36px;
            margin-inline:2px ;
            border-radius: 8px;
            color: #23758e;
            font-weight: bold;
        }
        .qr-body{
            display: block;
            place-items: center;
            padding: 20px;
        }
        .qr-body img{
            max-width: 100%;
            max-height: 100%;
            padding: 20px;
            border: 2px solid #23758e;
            border-radius: 8px;
        }
        #home{
            position: absolute;
            right: 1%;
            top: 1%;
            padding: 9px 8px;
            background-color: rgb(255, 241, 241);
            border-radius: 10px;
            text-decoration: none;
            /* font-size: 1.2em; */

        }
        #home:hover{
          background: #efececfa;
        }
        @media screen and (max-width:520px){
            .box{
                width: 80%;
            }
            .qr-footer a{
                font-size: 15px;
                margin-inline: 10px;
                padding: 15px;
            }
            select>option{
                font-size: smaller;
            }

        }
    </style>
</head>
<body>
    <div class="box">
        <a href="./index.html" id="home">🏠</a>
        <div class="qr-header">
            <h1>Generate QR code</h1>

            <input type="text" id="qr-text" placeholder="Type your text or URL">
            <div><label for="sizes">Select size : </label>
            <select id="sizes">
                <option value="100">100x100</option>
                <option value="200">200x200</option>
                <option value="300">300x300</option>
            </select></div>
        </div>
        <div class="qr-body"></div>
        <div class="qr-footer">
            <a href="" id="Generate">Generate</a>
            <a href="" id="Download" download="QRCode.png">Download</a>
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const qrtext=document.querySelector("#qr-text");
        const sizes=document.querySelector("#sizes");
        const generatebtn=document.querySelector("#Generate");
        const downloadbtn=document.querySelector("#Download");
        const qrContainer=document.querySelector(".qr-body");

        let is_empty=()=>{
             if(qrtext.value.length > 0){
                generateQRCode();
            }
            else{
                alert("Please enter the TEXT or URL! ")
            }
        }
        generatebtn.addEventListener('click',(e)=>{
            e.preventDefault();
            is_empty();
            
        });
        let size=sizes.value;

        sizes.addEventListener('change',(e)=>{
            size= e.target.value;
            is_empty();
        })

        generateQRCode=()=>{
            qrContainer.innerHTML="";
            new QRCode(qrContainer,{
                text:qrtext.value,
                height:size,
                width:size,
                colorLight:"#ffffff",
                colorDark:"#000000",
            })
        }

        downloadbtn.addEventListener('click',()=>{

            let img=document.querySelector(".qr-body img");

            if(img !== null){
                downloadbtn.setAttribute("href",img.getAttribute('src'));
            }
            else{
                downloadbtn.setAttribute("href",`${document.querySelector("canvas").toDataURL()}`);
                    }

        })
        



    </script>
</body>
</html>
